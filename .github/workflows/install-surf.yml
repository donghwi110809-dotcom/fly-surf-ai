name: Install SURF Game

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get SURF
        run: |
          git clone --depth 1 https://github.com/jackbuehner/MicrosoftEdge-Surf.git surf-original
          rm -rf resources
          cp -R surf-original/resources ./resources

      - name: Commit files
        run: |
          rm -rf surf-original
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources
          git commit -m "Add SURF game resources" || exit 0
          git push
